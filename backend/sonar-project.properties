# sonar-project.properties
sonar.projectKey=international-payments-portal
sonar.projectName=International Payments Portal
sonar.projectVersion=1.0

# Source code directories
sonar.sources=backend/src
sonar.tests=backend/tests
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js

# Exclusions
sonar.exclusions=**/node_modules/**,**/coverage/**,**/*.test.js

# Coverage
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Security
sonar.security.hotspots.enabled=true

# Code smells
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules if needed
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1192
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js

sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.js