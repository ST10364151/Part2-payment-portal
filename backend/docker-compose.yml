# docker-compose.yml
version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: payments-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: st10320489
      MONGO_INITDB_ROOT_PASSWORD: ST10320489!
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - payments-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payments-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb+srv://st10320489:ST10320489!@portal.pevzq63.mongodb.net/payments_portal
      JWT_SECRET: e762673290a87c13a97c5bf0453a9e8dc58179274acff70a89dc4e9ed2944b8c
      JWT_EXPIRE: 24h
      SALT_ROUNDS: 12
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-change_this_pepper_value}
      SSL_KEY_PATH: /app/ssl/key.pem
      SSL_CERT_PATH: /app/ssl/cert.pem
    volumes:
      - ./backend/ssl:/app/ssl:ro
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:3001/api/health', {rejectUnauthorized: false}, (res) => process.exit(res.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend React App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: https://localhost:3001/api
    container_name: payments-frontend
    restart: unless-stopped
    ports:
      - "3000:443"
    depends_on:
      - backend
    networks:
      - payments-network
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "https://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  payments-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local