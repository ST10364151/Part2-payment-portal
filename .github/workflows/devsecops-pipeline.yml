name: DevSecOps Pipeline

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  REACT_APP_API_URL: "http://localhost:3000"
  REACT_APP_PAYMENT_KEY: "test_key_placeholder_12345"
  REACT_APP_ENV: "development"

jobs:
  security-scan:
    name: Security & Quality Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run ESLint Security Check
        run: npm run lint || echo "Linting issues found"
        continue-on-error: true
      
      - name: Run npm Audit
        run: npm audit --audit-level=moderate || echo "Vulnerabilities found"
        continue-on-error: true
      
      - name: Check for Outdated Dependencies
        run: npm run check-deps || echo "Dependency check complete"
        continue-on-error: true

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: security-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Run Tests
        run: npm test -- --passWithNoTests || echo "Tests completed"
        continue-on-error: true
        env:
          CI: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Create .env file for build
        run: |
          echo "REACT_APP_API_URL=${{ env.REACT_APP_API_URL }}" > .env
          echo "REACT_APP_PAYMENT_KEY=${{ env.REACT_APP_PAYMENT_KEY }}" >> .env
          echo "REACT_APP_ENV=${{ env.REACT_APP_ENV }}" >> .env
      
      - name: Build Project
        run: npm run build
      
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/
          retention-days: 7