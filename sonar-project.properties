# ===========================================================================
# SonarQube Cloud Configuration
# sonar-project.properties
# ===========================================================================

# Project identification
sonar.projectKey=ST10364151_Part2-payment-portal
sonar.organization=part2-payment-portal

# Project metadata
sonar.projectName=International Payment Portal
sonar.projectVersion=1.0

# Source directories - BACKEND ONLY (as per your config)
sonar.sources=backend/src

# Exclusions (don't scan these)
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/scripts/**,**/config/**

# Test file patterns (if you add tests later)
sonar.tests=backend/tests
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Language settings
sonar.language=js
sonar.sourceEncoding=UTF-8

# JavaScript specific settings
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Quality gate settings
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Security hotspots (enable for full analysis)
sonar.security.hotspots.mode=standard

# Code smell detection (enable)
sonar.issue.ignore.multicriteria=e1,e2

# Ignore specific rules if needed (can be removed for strict analysis)
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1481
sonar.issue.ignore.multicriteria.e1.resourceKey=**/utils/**

sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S3358
sonar.issue.ignore.multicriteria.e2.resourceKey=**/middleware/**
