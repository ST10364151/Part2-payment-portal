# ===========================================================================
# SonarQube Cloud Configuration 
# ===========================================================================

sonar.projectKey=ST10364151_Part2-payment-portal
sonar.organization=part2-payment-portal
sonar.projectName=International Payment Portal
sonar.projectVersion=1.0

# Only scan backend/src (smaller scope = faster)
sonar.sources=backend/src

# Aggressive exclusions to speed up scan
sonar.exclusions=**/node_modules/**,**/build/**,**/dist/**,**/coverage/**,**/*.test.js,**/*.spec.js,**/scripts/**,**/utils/**,**/config/**

# Encoding
sonar.sourceEncoding=UTF-8

# Disable some checks to speed up (can re-enable later)
sonar.javascript.node.maxspace=4096

# Don't wait for quality gate (faster)
sonar.qualitygate.wait=false

# Reduce analysis scope
sonar.scm.disabled=true
